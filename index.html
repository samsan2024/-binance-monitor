<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Binance · BTC 监控</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 15px 32px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.status{font-size:12px;color:#79e2a3}
.card{background:#121820;border:1px solid #202a35;border-radius:18px;padding:18px;margin-bottom:13px}
.label{color:#8d99a8;font-size:13px}
.price{font-size:42px;font-weight:800;margin:7px 0 3px;letter-spacing:-1px}
.change{font-size:15px;font-weight:700}
.up{color:#36d98a}.down{color:#ff6170}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:#0e141b;border-radius:12px;padding:12px}
.stat b{display:block;margin-top:5px;font-size:16px}
.tabs{display:flex;gap:7px;margin:13px 0}
.tab{flex:1;border:0;border-radius:10px;background:#1a222c;color:#9da8b5;padding:9px 4px;font-size:13px}
.tab.active{background:#f0b90b;color:#111;font-weight:800}
.chart{height:260px;position:relative}
canvas{width:100%;height:100%;display:block}
.footer{text-align:center;color:#667281;font-size:12px;margin-top:12px}
button{font:inherit;cursor:pointer}
.refresh{border:1px solid #303b48;background:#151d26;color:#dbe2ea;border-radius:10px;padding:8px 11px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">₿ BTC MONITOR</div>
    <div class="status" id="status">● 连接中</div>
  </div>

  <div class="card">
    <div class="label">BTC / USDT · Binance</div>
    <div class="price" id="price">--</div>
    <div class="change" id="change">--</div>

    <div class="grid">
      <div class="stat"><span class="label">24H 最高</span><b id="high">--</b></div>
      <div class="stat"><span class="label">24H 最低</span><b id="low">--</b></div>
      <div class="stat"><span class="label">24H 成交量</span><b id="volume">--</b></div>
      <div class="stat"><span class="label">更新时间</span><b id="time">--</b></div>
    </div>
  </div>

  <div class="card">
    <div class="label">价格走势</div>
    <div class="tabs">
      <button class="tab active" data-interval="1m">1m</button>
      <button class="tab" data-interval="5m">5m</button>
      <button class="tab" data-interval="15m">15m</button>
      <button class="tab" data-interval="1h">1h</button>
    </div>
    <div class="chart"><canvas id="chart"></canvas></div>
  </div>

  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-weight:700">行情自动刷新</div>
      <div class="label" style="margin-top:4px">公开 Binance 行情接口，无需 API Key</div>
    </div>
    <button class="refresh" id="refresh">↻ 刷新</button>
  </div>

  <div class="footer">数据来自 Binance 公共市场行情 · 仅供行情观察</div>
</div>

<script>
const APIS=[
  "https://api.binance.com/api/v3",
  "https://data-api.binance.vision/api/v3"
];
let API=APIS[0];
let interval="1m";

const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

async function getJSON(path){
  let lastError;
  for(const base of APIS){
    try{
      const r=await fetch(base+path,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      API=base;
      return await r.json();
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error("无法连接 Binance");
}

async function loadTicker(){
  const d=await getJSON("/ticker/24hr?symbol=BTCUSDT");
  const p=Number(d.lastPrice);
  const pct=Number(d.priceChangePercent);
  $("price").textContent="$"+fmt(p);
  $("change").textContent=(pct>=0?"+":"")+pct.toFixed(2)+"%  24H";
  $("change").className="change "+(pct>=0?"up":"down");
  $("high").textContent="$"+fmt(d.highPrice);
  $("low").textContent="$"+fmt(d.lowPrice);
  $("volume").textContent=Number(d.volume).toLocaleString("en-US",{maximumFractionDigits:2})+" BTC";
  $("time").textContent=new Date(d.closeTime).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

async function loadKlines(){
  const data=await getJSON("/klines?symbol=BTCUSDT&interval="+interval+"&limit=80");
  drawChart(data);
}

function drawChart(data){
  const c=$("chart"), ctx=c.getContext("2d");
  const rect=c.getBoundingClientRect(), dpr=devicePixelRatio||1;
  c.width=rect.width*dpr; c.height=rect.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=rect.width,h=rect.height;
  ctx.clearRect(0,0,w,h);

  const values=data.map(x=>Number(x[4]));
  const min=Math.min(...values), max=Math.max(...values), pad=(max-min)*.12||1;
  const lo=min-pad, hi=max+pad;
  const x=i=>i*(w-12)/(values.length-1)+6;
  const y=v=>h-10-(v-lo)/(hi-lo)*(h-20);

  ctx.strokeStyle="rgba(255,255,255,.07)";
  ctx.lineWidth=1;
  for(let i=1;i<4;i++){let yy=i*h/4;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}

  ctx.beginPath();
  values.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
  ctx.strokeStyle=values.at(-1)>=values[0]?"#36d98a":"#ff6170";
  ctx.lineWidth=2.2;ctx.stroke();

  const last=values.at(-1);
  ctx.fillStyle=ctx.strokeStyle;
  ctx.beginPath();ctx.arc(x(values.length-1),y(last),4,0,Math.PI*2);ctx.fill();
}

async function refresh(){
  $("status").textContent="● 更新中";
  try{
    await Promise.all([loadTicker(),loadKlines()]);
    $("status").textContent="● 已连接";
  }catch(e){
    console.error(e);
    $("status").textContent="● 无法连接";
    $("price").textContent="连接失败";
    $("change").textContent="请检查当前网络是否能访问 Binance";
  }
}

document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    interval=b.dataset.interval;
    loadKlines().catch(()=>{});
  });
});
$("refresh").onclick=refresh;
refresh();
setInterval(loadTicker,5000);
setInterval(loadKlines,30000);
window.addEventListener("resize",()=>loadKlines().catch(()=>{}));
</script>
</body>
</html>
